name: Generar APK Debug (DescontrolZombies)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false
          include-templates: true
      - name: Import
        run: godot --headless --path DescontrolZombies --editor --quit-after 10
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path DescontrolZombies --export-debug Android build/DescontrolZombies-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DescontrolZombies-debug-apk
          path: build/DescontrolZombies-debug.apk
          if-no-files-found: error
          retention-days: 30
