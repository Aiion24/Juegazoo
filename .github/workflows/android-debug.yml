name: Generar APK Debug (DescontrolZombies)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.3.0'
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import
        run: godot --headless --path DescontrolZombies --editor --quit-after 10
      - name: Install Android Gradle build template
        run: |
          mkdir -p build
          godot --headless --path DescontrolZombies --install-android-build-template --export-debug Android build/DescontrolZombies-template-bootstrap.apk
      - name: Export APK
        run: |
          mkdir -p build
          rm -f build/DescontrolZombies-template-bootstrap.apk
          godot --headless --path DescontrolZombies --export-debug Android build/DescontrolZombies-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DescontrolZombies-debug-apk
          path: build/DescontrolZombies-debug.apk
          if-no-files-found: error
          retention-days: 30
