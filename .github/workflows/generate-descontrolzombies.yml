name: Generate DescontrolZombies Project

on:
  push:
    branches: [main]
    paths:
      - 'create_descontrolzombies.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recover and run original generator
        run: |
          git show 4ed86399e5528625094f915b1fdb059e33b21270:create_descontrolzombies.py > /tmp/create_descontrolzombies.py
          python /tmp/create_descontrolzombies.py

      - name: Commit generated project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DescontrolZombies .github/workflows/android-debug.yml README_DESCONTROLZOMBIES.md .gitignore
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate DescontrolZombies Godot project'
          git push
